<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ссылки | OWNER</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            color: #ffffff;
            overflow-x: hidden;
            /* Убираем прыжки скролла */
            overscroll-behavior: none; 
            /* Статичный градиент: от белого (сверху) к черному. 
               Переход происходит на протяжении 80% высоты, 
               оставшиеся 20% — чистый черный. fixed — чтобы фон не скроллился. */
            background: linear-gradient(to bottom, #fff 0%, #000 80%) fixed;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 32px;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 20px;
            min-height: 100vh;
            justify-content: center;
        }

        .glass-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            /* Немного затемним карточку и увеличим контраст обводки,
               чтобы текст читался на белом фоне градиента */
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 24px;
            color: #ffffff;
            text-align: center;
            /* Оптимизация анимации, убирает дерганья */
            will-change: transform, box-shadow, background;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background 0.3s ease, 
                        box-shadow 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-card:hover {
            transform: scale(1.04) translateY(-5px);
            background: rgba(25, 25, 25, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .icon-wrapper {
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.9);
        }

        .glass-card h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .glass-card p {
            font-size: 1.1rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }
            .glass-card {
                padding: 30px 24px;
            }
            .glass-card h2 {
                font-size: 1.3rem;
            }
            .glass-card p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Блок 1: Личные сообщения -->
        <a href="https://t.me/kkinti" target="_blank" class="glass-card">
            <div class="icon-wrapper">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>
            <h2>Личные сообщения</h2>
            <p>Нажми, чтобы открыть диалог со мной</p>
        </a>

        <!-- Блок 2: Канал -->
        <a href="https://t.me/ownerpytb" target="_blank" class="glass-card">
            <div class="icon-wrapper">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </div>
            <h2>Канал</h2>
            <p>Канал овнера</p>
        </a>

        <!-- Блок 3: Фотохостинг -->
        <a href="https://t.me/photohostbbbot" target="_blank" class="glass-card">
            <div class="icon-wrapper">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <h2>Фотохостинг</h2>
            <p>Открой бота-фотохостинг</p>
        </a>
    </main>

</body>
</html>
